name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: List Qt cmake modules
        run: |
          Write-Host "QT_ROOT_DIR = $env:QT_ROOT_DIR"
          Write-Host "--- lib/cmake 下的 Qt6* ---"
          Get-ChildItem "$env:QT_ROOT_DIR\lib\cmake" -Directory -Filter "Qt6*" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Write-Host "--- 查找 WebEngine ---"
          Get-ChildItem "$env:QT_ROOT_DIR" -Recurse -Filter "*WebEngine*" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName | Select-Object -First 20

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt dependencies
        run: windeployqt --release --no-translations build\Breeze.exe

      - name: Package
        run: Compress-Archive -Path build\* -DestinationPath Breeze-win64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Breeze-win64
          path: Breeze-win64.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Breeze-win64.zip
