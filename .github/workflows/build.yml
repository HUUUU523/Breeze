name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write    # 允许创建 Release

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt dependencies
        run: windeployqt --release --no-translations build\Breeze.exe

      # ---- 代码签名准备 ----
      - name: Decode signing certificate
        shell: pwsh
        run: |
          $b64 = "${{ secrets.CODE_SIGN_PFX_BASE64 }}" -replace '\s',''
          if ([string]::IsNullOrWhiteSpace($b64)) { throw "CODE_SIGN_PFX_BASE64 secret is empty" }
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", $bytes)

      - name: Verify secrets present
        shell: pwsh
        run: |
          Write-Host "PFX base64 length: $("${{ secrets.CODE_SIGN_PFX_BASE64 }}".Length)"
          Write-Host "Password length: $("${{ secrets.CODE_SIGN_PFX_PASSWORD }}".Length)"

      - name: Locate signtool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          echo "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      # ---- 签名主程序 ----
      - name: Sign Breeze.exe
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p "${{ secrets.CODE_SIGN_PFX_PASSWORD }}" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "build\Breeze.exe"
          if ($LASTEXITCODE -ne 0) { throw "Signing Breeze.exe failed" }

      - name: Package (zip)
        run: Compress-Archive -Path build\* -DestinationPath Breeze-win64.zip -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      # ---- 签名安装包 ----
      - name: Sign installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Filter "Breeze-*-Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer not found" }
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p "${{ secrets.CODE_SIGN_PFX_PASSWORD }}" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signing installer failed" }

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Breeze-win64
          path: Breeze-win64.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Breeze-installer
          path: Breeze-*-Setup.exe
          if-no-files-found: warn

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Breeze-win64.zip
            Breeze-*-Setup.exe

